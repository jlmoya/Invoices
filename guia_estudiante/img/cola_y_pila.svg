<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="600" fill="#1f2937">La cola atiende la factura más antigua; la pila deshace el cambio más reciente</text>
  <line x1="410" y1="50" x2="410" y2="300" stroke="#e5e7eb"/>
  <text x="20" y="62" font-size="13" font-weight="600" fill="#1f2937">Cola de cobranza (FIFO)</text>
  <text x="67" y="100" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">Frente</text>
  <text x="237" y="100" font-size="11" font-weight="600" fill="#4b5563" text-anchor="middle">Final</text>
  <rect x="30" y="110" width="75" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="115" y="110" width="75" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
  <rect x="200" y="110" width="75" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
  <rect x="320" y="110" width="70" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25" stroke-dasharray="5 3"/>
  <g text-anchor="middle" fill="#1f2937">
    <text x="67" y="132" font-size="13" font-weight="700">1002</text><text x="67" y="150" font-size="11" fill="#4b5563">3 sep</text>
    <text x="152" y="132" font-size="13" font-weight="700">1003</text><text x="152" y="150" font-size="11" fill="#4b5563">8 sep</text>
    <text x="237" y="132" font-size="13" font-weight="700">1005</text><text x="237" y="150" font-size="11" fill="#4b5563">15 sep</text>
    <text x="355" y="132" font-size="13" font-weight="700">1007</text><text x="355" y="150" font-size="11" fill="#4b5563">nueva</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.25" fill="none">
    <path d="M318 135H279" marker-end="url(#flecha)"/>
    <path d="M67 162V200" marker-end="url(#flecha)"/>
  </g>
  <text x="355" y="180" font-size="11" fill="#4b5563" text-anchor="middle">encolar: se emite</text>
  <text x="30" y="218" font-size="11" fill="#4b5563">desencolar: se paga</text>
  <text x="30" y="258" font-size="12" fill="#1f2937">El frente es el menor número pendiente;</text>
  <text x="30" y="276" font-size="12" fill="#1f2937">cada factura emitida entra al final.</text>
  <text x="440" y="62" font-size="13" font-weight="600" fill="#1f2937">Pila de precios de PAP-001 (LIFO)</text>
  <text x="540" y="94" font-size="11" fill="#4b5563" text-anchor="middle">apilar</text>
  <text x="620" y="94" font-size="11" fill="#4b5563" text-anchor="middle">desapilar</text>
  <g stroke="#4b5563" stroke-width="1.25" fill="none">
    <path d="M540 100V146" marker-end="url(#flecha)"/>
    <path d="M620 146V100" marker-end="url(#flecha)"/>
  </g>
  <text x="490" y="174" font-size="11" font-weight="600" fill="#2563eb" text-anchor="end">Tope</text>
  <rect x="500" y="150" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="500" y="194" width="160" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
  <line x1="488" y1="240" x2="672" y2="240" stroke="#9ca3af" stroke-width="2"/>
  <g text-anchor="middle" fill="#1f2937" font-size="12.5">
    <text x="580" y="175"><tspan font-weight="700">125.00</tspan> · cambio 2</text>
    <text x="580" y="219"><tspan font-weight="700">119.00</tspan> · cambio 1</text>
  </g>
  <text x="580" y="268" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">Precio actual: 129.00</text>
  <text x="580" y="290" font-size="11.5" fill="#4b5563" text-anchor="middle">Deshacer desapila y restaura ese precio</text>
</svg>
